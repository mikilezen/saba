x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
    args:
      SABA_CHANNELS: ${SABA_CHANNELS:-whatsapp}
  environment:
    # Bootstrap a working config.json on first boot (binds that work across
    # the container boundary; secrets generated if not provided).
    SABA_DOCKER_BOOTSTRAP: "1"
    SABA_WEB_TOKEN: ${SABA_WEB_TOKEN:-}
    SABA_API_KEY: ${SABA_API_KEY:-}
  volumes:
    - ~/.saba:/home/saba/.saba
  cap_drop:
    - ALL
  # Entrypoint uses these to fix bind-mount ownership and drop to the saba user.
  cap_add:
    - CHOWN
    - SETGID
    - SETUID
  # Prevent the non-root process from regaining capabilities through setuid
  # binaries or file capabilities left inside the container image.
  security_opt:
    - no-new-privileges:true

services:
  saba-gateway:
    container_name: saba-gateway
    <<: *common-config
    command: ["gateway"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:18790:18790
      - 8765:8765
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  saba-api:
    container_name: saba-api
    <<: *common-config
    command:
      ["serve", "--host", "0.0.0.0", "-w", "/home/saba/.saba/api-workspace"]
    restart: unless-stopped
    ports:
      - 127.0.0.1:8900:8900
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  saba-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
