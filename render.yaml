services:
  - type: web
    name: saba-et-web
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn saba_et.web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: SUPABASE_DB_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: SEARCHAPI_ENABLED
        value: "false"
      - key: SEARCHAPI_API_KEY
        sync: false
      - key: SEARCHAPI_ENGINE
        value: google
      - key: VAPI_AUTO_CALL_ENABLED
        value: "false"
      - key: VAPI_API_KEY
        sync: false
      - key: VAPI_ASSISTANT_ID
        sync: false
      - key: VAPI_PHONE_NUMBER_ID
        sync: false
      - key: VAPI_WEBHOOK_SECRET
        sync: false
      - key: VAPI_MAX_CALLS_PER_DAY
        value: "3"
      - key: TELNYX_API_KEY
        sync: false
      - key: TELNYX_PUBLIC_KEY
        sync: false
